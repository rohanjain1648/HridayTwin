# One-click deploy on Render (render.com): New -> Blueprint -> point at this repo.
# Free tier: no card required, sleeps after 15 min idle, cold start ~30-60s.
services:
  - type: web
    name: hridaytwin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
